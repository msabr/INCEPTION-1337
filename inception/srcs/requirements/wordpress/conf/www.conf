[www]
user = www-data
group = www-data
; PHP-FPM's own daemon should run as the regular web-server user, not root.

listen = 9000
; Listen on TCP port 9000 (instead of the default unix socket), so the
; nginx container — which is a separate machine on our network — can reach it.

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; How many PHP worker processes to keep ready. These defaults are plenty
; for a small site like this one.
