<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Virtual machines compared with Docker containers</title>
  <desc id="d">On the left, each virtual machine carries its own guest operating system on top of a hypervisor. On the right, Docker containers share the host kernel and only carry their own libraries and app.</desc>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#22304a" text-anchor="middle">
    <rect x="0.5" y="0.5" width="999" height="519" rx="22" fill="#f7f9fc" stroke="#dfe6f1"/>

    <!-- Left panel -->
    <rect x="30" y="30" width="445" height="460" rx="16" fill="#ffffff" stroke="#dfe6f1"/>
    <text x="252" y="70" font-size="22" font-weight="800">Virtual machines</text>
    <text x="252" y="94" font-size="14" fill="#5a6a86">Each app carries a full guest OS</text>

    <g font-size="14" font-weight="600">
      <rect x="50" y="400" width="405" height="40" rx="8" fill="#9aa7bd"/>
      <text x="252" y="425" fill="#ffffff">Hardware</text>
      <rect x="50" y="352" width="405" height="40" rx="8" fill="#c7d1e2"/>
      <text x="252" y="377">Host OS</text>
      <rect x="50" y="304" width="405" height="40" rx="8" fill="#5f6f8c"/>
      <text x="252" y="329" fill="#ffffff">Hypervisor</text>

      <!-- VM 1 -->
      <rect x="50" y="252" width="126" height="44" rx="8" fill="#f2b8b0"/>
      <text x="113" y="279">Guest OS</text>
      <rect x="50" y="208" width="126" height="36" rx="8" fill="#cfe3f7"/>
      <text x="113" y="231">Libs</text>
      <rect x="50" y="164" width="126" height="36" rx="8" fill="#22b573"/>
      <text x="113" y="187">nginx</text>
      <!-- VM 2 -->
      <rect x="189" y="252" width="126" height="44" rx="8" fill="#f2b8b0"/>
      <text x="252" y="279">Guest OS</text>
      <rect x="189" y="208" width="126" height="36" rx="8" fill="#cfe3f7"/>
      <text x="252" y="231">Libs</text>
      <rect x="189" y="164" width="126" height="36" rx="8" fill="#38a3d8"/>
      <text x="252" y="187">wordpress</text>
      <!-- VM 3 -->
      <rect x="328" y="252" width="127" height="44" rx="8" fill="#f2b8b0"/>
      <text x="391" y="279">Guest OS</text>
      <rect x="328" y="208" width="127" height="36" rx="8" fill="#cfe3f7"/>
      <text x="391" y="231">Libs</text>
      <rect x="328" y="164" width="127" height="36" rx="8" fill="#e8a33d"/>
      <text x="391" y="187">mariadb</text>
    </g>
    <text x="252" y="128" font-size="14" fill="#5a6a86">Size: gigabytes. Start: minutes.</text>
    <text x="252" y="148" font-size="14" fill="#5a6a86">Strong isolation.</text>

    <!-- Right panel -->
    <rect x="525" y="30" width="445" height="460" rx="16" fill="#ffffff" stroke="#dfe6f1"/>
    <text x="747" y="70" font-size="22" font-weight="800">Docker containers</text>
    <text x="747" y="94" font-size="14" fill="#5a6a86">Apps share the host kernel</text>

    <g font-size="14" font-weight="600">
      <rect x="545" y="400" width="405" height="40" rx="8" fill="#9aa7bd"/>
      <text x="747" y="425" fill="#ffffff">Hardware</text>
      <rect x="545" y="352" width="405" height="40" rx="8" fill="#c7d1e2"/>
      <text x="747" y="377">Host OS (one shared kernel)</text>
      <rect x="545" y="304" width="405" height="40" rx="8" fill="#2496ed"/>
      <text x="747" y="329" fill="#ffffff">Docker Engine</text>

      <rect x="545" y="260" width="126" height="36" rx="8" fill="#cfe3f7"/>
      <text x="608" y="283">Libs</text>
      <rect x="545" y="216" width="126" height="36" rx="8" fill="#22b573"/>
      <text x="608" y="239">nginx</text>

      <rect x="684" y="260" width="126" height="36" rx="8" fill="#cfe3f7"/>
      <text x="747" y="283">Libs</text>
      <rect x="684" y="216" width="126" height="36" rx="8" fill="#38a3d8"/>
      <text x="747" y="239">wordpress</text>

      <rect x="823" y="260" width="127" height="36" rx="8" fill="#cfe3f7"/>
      <text x="886" y="283">Libs</text>
      <rect x="823" y="216" width="127" height="36" rx="8" fill="#e8a33d"/>
      <text x="886" y="239">mariadb</text>
    </g>
    <text x="747" y="128" font-size="14" fill="#5a6a86">Size: megabytes. Start: seconds.</text>
    <text x="747" y="148" font-size="14" fill="#5a6a86">Lighter isolation.</text>
    <g font-size="13" fill="#5a6a86">
      <text x="747" y="196">No guest OS here. This is the layer you save.</text>
    </g>

    <text x="500" y="508" font-size="13" fill="#5a6a86">Same three apps on both sides. Docker just drops one layer.</text>
  </g>
</svg>
