<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Inception architecture</title>
  <desc id="d">A browser reaches the NGINX container on port 443 with TLS 1.3. NGINX talks to WordPress with PHP-FPM on port 9000. WordPress talks to MariaDB on port 3306. All three containers sit on the inception Docker network. Two volumes store the website files and the database on the host under /home/msabr/data.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#33425c"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b5fb0"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#22304a">
    <rect x="0.5" y="0.5" width="1119" height="739" rx="22" fill="#f7f9fc" stroke="#dfe6f1"/>

    <!-- Browser -->
    <g stroke="#33425c" stroke-width="2.5" fill="#ffffff">
      <circle cx="230" cy="58" r="28"/>
      <ellipse cx="230" cy="58" rx="12" ry="28" fill="none"/>
      <line x1="202" y1="58" x2="258" y2="58"/>
      <path d="M208 42 Q230 48 252 42 M208 74 Q230 68 252 74" fill="none"/>
    </g>
    <text x="230" y="112" font-size="17" font-weight="700" text-anchor="middle">Browser</text>
    <text x="230" y="132" font-size="14" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">https://msabr.42.fr</text>

    <!-- Note top right -->
    <g font-size="17" fill="#33425c">
      <text x="560" y="62">Only NGINX is open to the outside, on port 443.</text>
      <text x="560" y="90">WordPress and MariaDB stay inside the Docker network.</text>
      <text x="560" y="118">No one can reach them from the internet.</text>
    </g>

    <!-- Host box -->
    <rect x="40" y="196" width="1040" height="480" rx="18" fill="#eef2f8" stroke="#cdd7e6"/>
    <text x="1056" y="228" font-size="16" font-weight="700" text-anchor="end">Host machine (the virtual machine)</text>

    <!-- Docker network -->
    <rect x="90" y="250" width="940" height="216" rx="16" fill="#dbe9fb" stroke="#2496ed" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="1006" y="278" font-size="15" font-weight="700" fill="#1b5fb0" text-anchor="end">Docker network: inception (bridge)</text>

    <!-- nginx -->
    <g>
      <rect x="130" y="296" width="200" height="124" rx="12" fill="#ffffff" stroke="#b9c6da" stroke-width="1.5"/>
      <path d="M130 332 V308 a12 12 0 0 1 12 -12 H318 a12 12 0 0 1 12 12 V332 z" fill="#22b573"/>
      <text x="230" y="321" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">nginx</text>
      <g font-size="14" text-anchor="middle" fill="#33425c">
        <text x="230" y="358">Reverse proxy</text>
        <text x="230" y="378">TLS 1.3 only</text>
        <text x="230" y="402" font-family="Consolas, 'Courier New', monospace" font-size="13">debian:bookworm</text>
      </g>
    </g>

    <!-- wordpress -->
    <g>
      <rect x="460" y="296" width="200" height="124" rx="12" fill="#ffffff" stroke="#b9c6da" stroke-width="1.5"/>
      <path d="M460 332 V308 a12 12 0 0 1 12 -12 H648 a12 12 0 0 1 12 12 V332 z" fill="#38a3d8"/>
      <text x="560" y="321" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">wordpress</text>
      <g font-size="14" text-anchor="middle" fill="#33425c">
        <text x="560" y="358">WordPress + PHP-FPM</text>
        <text x="560" y="378">Set up with WP-CLI</text>
        <text x="560" y="402" font-family="Consolas, 'Courier New', monospace" font-size="13">debian:bookworm</text>
      </g>
    </g>

    <!-- mariadb -->
    <g>
      <rect x="790" y="296" width="200" height="124" rx="12" fill="#ffffff" stroke="#b9c6da" stroke-width="1.5"/>
      <path d="M790 332 V308 a12 12 0 0 1 12 -12 H978 a12 12 0 0 1 12 12 V332 z" fill="#e8a33d"/>
      <text x="890" y="321" font-size="17" font-weight="800" text-anchor="middle" fill="#3a2a05">mariadb</text>
      <g font-size="14" text-anchor="middle" fill="#33425c">
        <text x="890" y="358">MariaDB server</text>
        <text x="890" y="378">Site database and users</text>
        <text x="890" y="402" font-family="Consolas, 'Courier New', monospace" font-size="13">debian:bookworm</text>
      </g>
    </g>

    <!-- Arrow browser -> nginx -->
    <line x1="230" y1="140" x2="230" y2="294" stroke="#33425c" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="166" y="154" width="128" height="28" rx="14" fill="#ffffff" stroke="#b9c6da"/>
    <text x="230" y="173" font-size="14" font-weight="700" text-anchor="middle">443, TLS 1.3</text>

    <!-- Container links -->
    <g stroke="#1b5fb0" stroke-width="2.5" stroke-dasharray="6 5">
      <line x1="334" y1="372" x2="456" y2="372" marker-start="url(#ahb)" marker-end="url(#ahb)"/>
      <line x1="664" y1="372" x2="786" y2="372" marker-start="url(#ahb)" marker-end="url(#ahb)"/>
    </g>
    <g text-anchor="middle" fill="#1b5fb0">
      <text x="395" y="358" font-size="16" font-weight="800">9000</text>
      <text x="395" y="396" font-size="13">FastCGI</text>
      <text x="725" y="358" font-size="16" font-weight="800">3306</text>
      <text x="725" y="396" font-size="13">MySQL</text>
    </g>

    <!-- Volume links -->
    <g stroke="#33425c" stroke-width="2" stroke-dasharray="6 5" fill="none">
      <line x1="380" y1="514" x2="250" y2="424" marker-end="url(#ah)"/>
      <line x1="410" y1="514" x2="540" y2="424" marker-end="url(#ah)"/>
      <line x1="890" y1="514" x2="890" y2="424" marker-end="url(#ah)"/>
    </g>

    <!-- Volume wp_vol -->
    <g>
      <path d="M330 526 V566 a65 14 0 0 0 130 0 V526 z" fill="#ffffff" stroke="#33425c" stroke-width="2"/>
      <ellipse cx="395" cy="526" rx="65" ry="14" fill="#f2f5fa" stroke="#33425c" stroke-width="2"/>
      <text x="395" y="560" font-size="15" font-weight="800" text-anchor="middle">wp_vol</text>
    </g>
    <g font-size="13" text-anchor="middle" fill="#33425c" font-family="Consolas, 'Courier New', monospace">
      <text x="395" y="604">host: /home/msabr/data/wp</text>
      <text x="395" y="626">in containers: /var/www/html/wordpress</text>
    </g>
    <text x="395" y="648" font-size="13" text-anchor="middle" fill="#33425c">Shared by nginx and wordpress</text>

    <!-- Volume db_vol -->
    <g>
      <path d="M825 526 V566 a65 14 0 0 0 130 0 V526 z" fill="#ffffff" stroke="#33425c" stroke-width="2"/>
      <ellipse cx="890" cy="526" rx="65" ry="14" fill="#f2f5fa" stroke="#33425c" stroke-width="2"/>
      <text x="890" y="560" font-size="15" font-weight="800" text-anchor="middle">db_vol</text>
    </g>
    <g font-size="13" text-anchor="middle" fill="#33425c" font-family="Consolas, 'Courier New', monospace">
      <text x="890" y="604">host: /home/msabr/data/db</text>
      <text x="890" y="626">in container: /var/lib/mysql</text>
    </g>
    <text x="890" y="648" font-size="13" text-anchor="middle" fill="#33425c">Used by mariadb only</text>

    <!-- Legend -->
    <g font-size="13" fill="#33425c">
      <rect x="64" y="700" width="26" height="18" rx="4" fill="#ffffff" stroke="#b9c6da" stroke-width="1.5"/>
      <text x="100" y="714">Container</text>
      <path d="M200 704 V716 a11 4 0 0 0 22 0 V704 z" fill="#ffffff" stroke="#33425c" stroke-width="1.5"/>
      <ellipse cx="211" cy="704" rx="11" ry="4" fill="#f2f5fa" stroke="#33425c" stroke-width="1.5"/>
      <text x="234" y="714">Volume</text>
      <line x1="320" y1="709" x2="356" y2="709" stroke="#1b5fb0" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ahb)"/>
      <text x="366" y="714">Network link, with its port</text>
      <line x1="560" y1="709" x2="596" y2="709" stroke="#33425c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
      <text x="606" y="714">Volume mounted in a container</text>
    </g>
  </g>
</svg>
